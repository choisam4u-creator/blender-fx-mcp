[project]
name = "blender-fx-mcp"
version = "0.6.3"
description = "AI가 말로 시키면 블렌더 FX(파괴·폭발·물)를 만들어 주는 MCP 서버 / Blender FX (destruction, explosion, water) MCP server for AI clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Choi" }]
keywords = ["blender", "mcp", "vfx", "destruction", "explosion", "fluid", "simulation", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = ["mcp[cli]>=2.0"]

[project.urls]
Homepage = "https://github.com/choisam4u-creator/blender-fx-mcp"
Documentation = "https://github.com/choisam4u-creator/blender-fx-mcp#readme"
Issues = "https://github.com/choisam4u-creator/blender-fx-mcp/issues"
Changelog = "https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/choisam4u-creator/blender-fx-mcp/security/policy"

[project.scripts]
blender-fx-mcp = "blender_fx_mcp.server:main"
blender-fx-headless = "blender_fx_mcp.headless:main"
blender-fx-doctor = "blender_fx_mcp.doctor:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_fx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["app_only: 블렌더 앱에서만 도는 시험(Mantaflow 유체). bpy 모듈로는 건너뛴다"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# 레시피는 서버가 `PARAMS = {...}` 와 _common.py 를 앞에 붙여 블렌더로 보낸다. 그 이름들은 파일 안에 정의가 없다.
"src/blender_fx_mcp/recipes/*.py" = ["F821"]
# _common.py 의 import 는 뒤에 붙는 레시피 파일들이 쓴다.
"src/blender_fx_mcp/recipes/_common.py" = ["F401"]
