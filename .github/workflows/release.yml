# 태그(v*)를 밀면 sdist·휠을 만들어 PyPI 에 올린다. 태그는 사람이 승인한 뒤 Mac 에서 민다(docs/registry.md).
# build 와 publish 를 나눈다: 저장소 코드는 읽기 권한만 가진 build 에서만 돌고,
# publish 는 build 가 올린 파일만 내려받아 신뢰 게시(Trusted Publishing, OIDC)로 올린다. PyPI 토큰 비밀 값은 쓰지 않는다.
name: release

on:
  push:
    tags: ["v*"]

# 기본 토큰은 읽기만(OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # 태그 v0.7.0 이면 pyproject 판도 0.7.0 이어야 한다(다른 판을 잘못 올리지 않게).
      - name: 태그와 pyproject 판 일치 확인
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME} 와 pyproject.toml 판 ${version} 이 다름 → 판을 맞춘 커밋에 태그를 다시 단다"
            exit 1
          fi
      # 버전 네 곳·CHANGELOG 날짜·README mcp-name (출시 상태가 아니면 실패)
      - run: uv run --no-project --python 3.13 python scripts/release_check.py
      - run: uv build
      # 만든 휠·sdist 의 METADATA·라이선스 파일, PyPI 와 같은 검사기(twine 7.0.0 부터 Metadata-Version 2.5)
      - run: uv run --no-project --python 3.13 python scripts/release_check.py --dist dist
      - run: uvx twine@7.0.0 check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # 저장소 코드를 받지도, 빌드하지도 않는다. build 의 결과물만 올린다.
  # PyPI 쪽에 이 저장소·release.yml·환경 pypi 를 신뢰 게시자로 등록해 둬야 한다(docs/registry.md).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
