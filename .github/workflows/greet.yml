# 처음 이슈·PR 을 연 사람에게 한/영 길잡이 댓글을 단다(응답 목표 7~14일보다 먼저 닿게).
# pull_request_target 은 포크 PR 에도 댓글을 달 수 있게 하려는 것이다. 이 작업은 PR 의 코드를 체크아웃하거나 실행하지 않는다
# (checkout·run 단계 없음, tests/test_repo_files.py 가 지킨다). 그래서 zizmor 의 dangerous-triggers 를 이 줄에서만 끈다.
name: greet

on:
  issues:
    types: [opened]
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened]

# 기본 토큰은 읽기만. 댓글을 다는 작업만 issues·pull-requests 쓰기를 받는다.
permissions:
  contents: read

jobs:
  first-interaction:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            첫 이슈 고맙습니다! 관리자 한 명이 보는 프로젝트라 첫 답은 버그 7일·질문/기능 14일 안이 목표입니다([SUPPORT.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/SUPPORT.md)).
            버그라면 `blender-fx-doctor` 출력(또는 `--json`)이 있으면 바로 재현할 수 있습니다. 오류 문장별 해결법은 [docs/troubleshooting.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/troubleshooting.md) 에 있습니다.

            Thanks for your first issue! This project has a single maintainer; first replies aim for 7 days (bugs) or 14 days (questions and ideas), see [SUPPORT.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/SUPPORT.md).
            For a bug, the output of `blender-fx-doctor` (or `--json`) lets us reproduce it right away. Fixes for common error messages are in [docs/troubleshooting.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/troubleshooting.md).
          pr_message: |
            첫 PR 고맙습니다! 블렌더 없이 도는 시험은 `uv run pytest -q`, 린트는 `uvx ruff@0.15.20 check .` 입니다. 한/영 문장 규칙과 작은 일 목록은 [CONTRIBUTING.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/CONTRIBUTING.md) 에 있습니다.

            Thanks for your first pull request! Run `uv run pytest -q` (works without Blender) and `uvx ruff@0.15.20 check .`. Message rules and small starter tasks are in [CONTRIBUTING.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/CONTRIBUTING.md#good-first-contributions).
