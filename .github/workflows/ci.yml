# 블렌더 없이 도는 서버 단위 테스트만 CI 에서 돌린다. 레시피 테스트는 블렌더가 있는 로컬에서 `uv run pytest -q`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 기본 토큰은 읽기만. 외부 PR 의 액션이 저장소를 바꾸지 못하게 한다(OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  # 판을 고정해 규칙이 저절로 바뀌지 않게 한다. 설정은 pyproject.toml 의 [tool.ruff].
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uvx ruff@0.15.20 check .

  # 서버 쪽(레시피 제외) 커버리지를 로그와 작업 요약에 남긴다. 설정은 pyproject.toml 의 [tool.coverage].
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest -q tests/test_server.py tests/test_server_params.py tests/test_registry.py tests/test_recipe_messages.py tests/test_server_messages.py tests/test_repo_files.py tests/test_examples.py tests/test_server_tools.py tests/test_troubleshooting.py tests/test_headless.py tests/test_server_choices.py tests/test_doctor.py tests/test_server_ranges.py tests/test_release_check.py --cov --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - run: uv build

  # `pip install bpy` 로 레시피 시험 대부분을 블렌더 앱 없이 돌린다.
  # 렌더에는 libEGL(소프트웨어 Mesa)이 필요하다. bpy 휠에서 깨지는 유체 시험(`app_only`)은 tests/conftest.py 가 건너뛴다.
  recipe-tests-bpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 libegl-mesa0 libgl1-mesa-dri
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv pip install bpy==5.0.1
      - run: uv run pytest -q
        env:
          BLENDER_FX_BLENDER: ${{ github.workspace }}/.venv/bin/python
