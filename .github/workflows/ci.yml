# 블렌더 없이 도는 서버 단위 테스트만 CI 에서 돌린다. 레시피 테스트는 블렌더가 있는 로컬에서 `uv run pytest -q`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest -q tests/test_server.py tests/test_server_params.py
      - run: uv build

  # `pip install bpy` 로 레시피 시험 대부분을 블렌더 앱 없이 돌린다.
  # bpy 휠은 Mantaflow 가 깨져 있어 `fluid` 표시 시험은 tests/conftest.py 가 건너뛴다.
  recipe-tests-bpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0
      - run: uv python install 3.11
      - run: uv sync --group dev --python 3.11
      - run: uv pip install bpy==5.0.1
      - run: uv run pytest -q
        env:
          BLENDER_FX_BLENDER: ${{ github.workspace }}/.venv/bin/python
