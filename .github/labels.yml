# 저장소 라벨 정의. 이슈 양식·문서·dependabot 이 쓰는 라벨은 모두 여기 있어야 한다(tests/test_repo_files.py).
# 라벨은 클라우드에서 만들지 않는다. 관리자가 docs/maintenance.md 의 `gh label create` 명령으로 만든다.
# 설명은 "한국어 / English", GitHub 제한 100자 안.
- name: "bug"
  color: "d73a4a"
  description: "동작이 문서와 다름 / Something does not work as documented"
- name: "enhancement"
  color: "a2eeef"
  description: "새 기능·개선 요청 / New feature or improvement"
- name: "needs-info"
  color: "fbca04"
  description: "재현 정보를 기다림, 30일 뒤 닫힐 수 있음 / Waiting for repro info, may close after 30 days"
- name: "good first issue"
  color: "7057ff"
  description: "처음 기여하기 좋은 작은 일 / Small task for first-time contributors"
- name: "question"
  color: "d876e3"
  description: "사용법 질문 / Usage question"
- name: "security"
  color: "b60205"
  description: "보안 관련, 자세한 내용은 비공개로 / Security related, details go private"
- name: "dependencies"
  color: "0366d6"
  description: "의존성·액션 판 갱신 / Dependency or action version update"
- name: "stale"
  color: "ededed"
  description: "needs-info 마감 7일 전 자동 표시 / Marked 7 days before the needs-info deadline"
