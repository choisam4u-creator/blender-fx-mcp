name: 질문 / Question
description: 사용법을 물어봐 주세요 / Ask how to do something
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        고맙습니다. 필수 칸(*)을 채워야 올라갑니다. 먼저 [docs/recipes.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/recipes.md)(32개 도구 예시)와 [docs/troubleshooting.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/troubleshooting.md)(오류 문장별 해결법)를 확인해 보세요.
        Thanks. Required fields (*) must be filled in. Please check [docs/recipes.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/recipes.md#english) (examples for all 32 tools) and [docs/troubleshooting.md](https://github.com/choisam4u-creator/blender-fx-mcp/blob/main/docs/troubleshooting.md) first.
        오류가 났다면 질문 대신 버그 신고 양식을 써 주세요. / If something failed with an error, please use the bug report form instead.
  - type: textarea
    id: goal
    attributes:
      label: 하려는 일 / What you are trying to do
      description: |
        만들고 싶은 장면이나 하고 싶은 작업. 예: "건물 두 채를 차례로 무너뜨리고 싶다"
        The scene or task you want, e.g. "collapse two buildings one after the other".
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 해 본 것 / What you tried
      description: |
        AI 에게 한 말, 불린 도구와 인자, 결과에서 기대와 다른 점.
        What you said to the AI, the tools and arguments it called, and what differed from what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: blender-fx-doctor 출력 / doctor output
      description: |
        연결·설치 질문이면 `uv run blender-fx-doctor --issue` 결과를 붙여 주세요(집 폴더는 `~` 로 가려짐. `--json` 도 됩니다).
        For setup or connection questions, paste the output of `uv run blender-fx-doctor --issue` (home folder masked as `~`; `--json` works too).
        `--issue` 출력은 그대로 붙이면 표로 보입니다. `--json` 이면 ```json 블록으로 감싸 주세요. / `--issue` output shows as a table when pasted as is; wrap `--json` output in a ```json block.
    validations:
      required: false
  - type: dropdown
    id: client
    attributes:
      label: MCP 클라이언트 / MCP client
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Cursor
        - 기타 / Other
    validations:
      required: false
